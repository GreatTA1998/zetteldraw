plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zetteldraw.v2'
    compileSdk 35

    defaultConfig {
        applicationId "com.zetteldraw.v2"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0-scaffold"
        // Boox Go 7 is arm64; emulator builds can override later.
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'

    // Onyx pen SDK — wire TouchHelper in ui.InkSurface later. Versions are a support matrix.
    implementation 'com.onyx.android.sdk:onyxsdk-pen:1.5.5'
    implementation 'com.onyx.android.sdk:onyxsdk-device:1.3.6'
}
