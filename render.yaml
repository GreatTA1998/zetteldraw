# Render Blueprint for the zetteldraw sync server. Secrets are entered in the
# Render dashboard (sync: false); nothing sensitive lives in this file.
services:
  - type: web
    name: zetteldraw-sync
    runtime: node
    rootDir: server
    # Singapore is the closest Render region to the Supabase project (ap-northeast-1).
    region: singapore
    # Free instances sleep after 15 idle minutes, which is the Boox's sync interval.
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_CA_CERT
        value: certs/supabase-prod-ca-2021.crt
      - key: S3_BUCKET
        value: zetteldraw-ink
      - key: DEVICE_TOKENS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
