# Render Blueprint for the zetteldraw sync server. Secrets are entered in the
# Render dashboard (sync: false); nothing sensitive lives in this file.
services:
  - type: web
    name: zetteldraw-sync
    runtime: node
    rootDir: server
    # Singapore is the closest Render region to the Supabase project (ap-northeast-1).
    region: singapore
    # Free instances sleep after 15 idle minutes; the first request after that waits for a cold start.
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_CA_CERT
        value: certs/supabase-prod-ca-2021.crt
      - key: S3_BUCKET
        value: zetteldraw-ink
      - key: DEVICE_TOKENS
        sync: false
      - key: GOOGLE_CLIENT_IDS
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: REJECT_DEVICE_TOKENS_AFTER_CLAIM
        value: "true"
      - key: ALLOW_TEST_GOOGLE_TOKENS
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

  # Web overview (Next.js) at zetteldraw.com. Talks to the sync server over its
  # public URL; the browser only ever sees this service. Sign-in is Google;
  # ZD_DEVICE_TOKEN is no longer used for the public library.
  - type: web
    name: zetteldraw-web
    runtime: node
    rootDir: web
    region: singapore
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    # "/" renders without calling the sync server, so a sleeping sync service cannot fail web deploys.
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: ZD_SERVER_URL
        value: https://zetteldraw-sync.onrender.com
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false
      - key: ZD_DEVICE_TOKEN
        sync: false

