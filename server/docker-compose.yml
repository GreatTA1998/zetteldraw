# Local dev: Postgres + MinIO + the sync service + the web overview.
#   docker compose up -d --build --wait
#   docker compose run --rm sync node dist/scripts/seed.js   # optional demo library
# Service: http://localhost:8787  (device token: dev-device-token)
# Web overview: http://localhost:43917  (sign in with the device token)
# MinIO console: http://localhost:59001  (zetteldraw / zetteldraw-secret)
name: zetteldraw

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zetteldraw
      POSTGRES_PASSWORD: zetteldraw
      POSTGRES_DB: zetteldraw
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zetteldraw -d zetteldraw"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    # MinIO stopped publishing community images to Docker Hub; pgsty/minio is a
    # maintained drop-in build of the same server. Override with MINIO_IMAGE.
    image: ${MINIO_IMAGE:-pgsty/minio:latest}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: zetteldraw
      MINIO_ROOT_PASSWORD: zetteldraw-secret
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  sync:
    build: .
    environment:
      PORT: "8787"
      DATABASE_URL: postgres://zetteldraw:zetteldraw@postgres:5432/zetteldraw
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: zetteldraw-ink
      S3_ACCESS_KEY: zetteldraw
      S3_SECRET_KEY: zetteldraw-secret
      DEVICE_TOKENS: ${DEVICE_TOKENS:-dev-device-token}
      SESSION_SECRET: ${SESSION_SECRET:-local-dev-session-secret}
      ALLOW_TEST_GOOGLE_TOKENS: ${ALLOW_TEST_GOOGLE_TOKENS:-true}
      REJECT_DEVICE_TOKENS_AFTER_CLAIM: ${REJECT_DEVICE_TOKENS_AFTER_CLAIM:-false}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      # Page size in device pixels assumed when rendering ink to PNG (Boox Go 7, portrait).
      PAGE_WIDTH: ${PAGE_WIDTH:-1264}
      PAGE_HEIGHT: ${PAGE_HEIGHT:-1680}
    ports:
      - "8787:8787"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

  web:
    build: ../web
    environment:
      ZD_SERVER_URL: http://sync:8787
      # Set to skip the sign-in screen (e.g. a wall display on a trusted network).
      ZD_DEVICE_TOKEN: ${ZD_DEVICE_TOKEN:-}
    ports:
      - "43917:43917"
    depends_on:
      sync:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:43917/api/session"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  miniodata:
