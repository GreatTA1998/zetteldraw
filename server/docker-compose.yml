# Local dev: Postgres + MinIO + the sync service.
#   docker compose up -d --build --wait
# Service: http://localhost:8787  (device token: dev-device-token)
# MinIO console: http://localhost:59001  (zetteldraw / zetteldraw-secret)
name: zetteldraw

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zetteldraw
      POSTGRES_PASSWORD: zetteldraw
      POSTGRES_DB: zetteldraw
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zetteldraw -d zetteldraw"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    # MinIO stopped publishing community images to Docker Hub; pgsty/minio is a
    # maintained drop-in build of the same server. Override with MINIO_IMAGE.
    image: ${MINIO_IMAGE:-pgsty/minio:latest}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: zetteldraw
      MINIO_ROOT_PASSWORD: zetteldraw-secret
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  sync:
    build: .
    environment:
      PORT: "8787"
      DATABASE_URL: postgres://zetteldraw:zetteldraw@postgres:5432/zetteldraw
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: zetteldraw-ink
      S3_ACCESS_KEY: zetteldraw
      S3_SECRET_KEY: zetteldraw-secret
      DEVICE_TOKENS: ${DEVICE_TOKENS:-dev-device-token}
    ports:
      - "8787:8787"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  miniodata:
